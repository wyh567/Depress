# Include this file from nginx's http context. The VM exposes only 80/443;
# all application and infrastructure listeners stay on loopback.
upstream depress_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream depress_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name de-press.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/depress-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/depress/tls/fullchain.pem;
    ssl_certificate_key /etc/depress/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 444;
}

server {
    listen 443 ssl;
    server_name de-press.xyz;

    ssl_certificate /etc/depress/tls/fullchain.pem;
    ssl_certificate_key /etc/depress/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 120s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/depress-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /health/live {
        proxy_pass http://depress_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
    }

    location = /health/ready {
        proxy_pass http://depress_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
    }

    location ~ ^/api/(?:internal|worker|outbox)(?:/|$) {
        return 404;
    }

    location = /api {
        return 404;
    }

    location /api/ {
        proxy_pass http://depress_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
    }

    location = /compile {
        return 404;
    }

    location ^~ /jobs/ {
        return 404;
    }

    location ^~ /_next/static/ {
        proxy_pass http://depress_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://depress_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
    }
}
